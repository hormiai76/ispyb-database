services:
  pydb-test:
    image: harbor.maxiv.lu.se/dockerhub/library/mariadb:10.11.11
    container_name: pydb-test
    post_start:
      - command: sh -c "sleep 10 && /var/local/ispyb-database/scripts/build_docker.sh"
    environment:
      MYSQL_DATABASE: 'test'
      # So you don't have to use root, but you can if you like
      MYSQL_USER: 'test'
      # You can use whatever password you like
      MYSQL_PASSWORD: 'test'
      # Password for root access
      MYSQL_ROOT_PASSWORD: 'rootpassword'
    ports:
      # <Port exposed> : <MySQL Port running inside container>
      - '3306:3306'
    expose:
      # Opens port 3306 on the container
      - '3306'
      # Where our data will be persisted
    volumes:
      - /var/local/mariadb/:/var/lib/mysql:rw
      - ./:/var/local/ispyb-database:rw
      - ./examples/.my.cnf:/var/local/ispyb-database/scripts/.my.cnf:ro
